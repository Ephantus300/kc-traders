<script>
const APP_ID = 1089; // Deriv public app ID
let ws;
let v75OddCount = 0;

function connect() {
    ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
    
    ws.onopen = () => {
        // Subscribe to live ticks
        ws.send(JSON.stringify({ticks: '1HZ100V', subscribe: 1}));
        ws.send(JSON.stringify({ticks: '1HZ75V', subscribe: 1}));
    };
    
    ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if(data.tick) {
            const symbol = data.tick.symbol;
            const price = data.tick.quote.toString();
            const digit = price[price.length - 1];
            
            if(symbol === '1HZ100V') updateV100(digit);
            if(symbol === '1HZ75V') updateV75(digit);
        }
    };
}

function updateV100(digit) {
    document.getElementById('v100-digit').textContent = digit;
    const status = document.getElementById('v100-status');
    const btn = document.getElementById('v100-btn');
    
    if(parseInt(digit) > 7) {
        status.className = 'status trade';
        status.textContent = 'TRADE NOW - DIGIT > 7';
        btn.style.display = 'block';
    } else {
        status.className = 'status wait';
        status.textContent = 'WAITING for digit > 7';
        btn.style.display = 'none';
    }
}

function updateV75(digit) {
    document.getElementById('v75-digit').textContent = digit;
    const status = document.getElementById('v75-status');
    const btn = document.getElementById('v75-btn');
    
    if(parseInt(digit) % 2 !== 0) v75OddCount++;
    else v75OddCount = 0;
    
    if(v75OddCount >= 4) {
        status.className = 'status trade';
        status.textContent = 'TRADE NOW - 4 ODD HIT';
        btn.style.display = 'block';
    } else {
        status.className = 'status wait';
        status.textContent = `WAITING... ${v75OddCount}/4 ODD`;
        btn.style.display = 'none';
    }
}

// Add BUY buttons to your HTML cards:
// <button id="v100-btn" onclick="buyTrade('1HZ100V')" style="display:none; width:100%; padding:15px; background:#ff6b00; border:none; border-radius:10px; color:#000; font-weight:bold; font-size:1.2em; margin-top:15px;">BUY NOW $10</button>

function buyTrade(symbol) {
    alert('Signal detected! Opening Deriv trade...');
    // Option A: Open Deriv with pre-filled contract
    window.open(`https://deriv.app/trade?symbol=${symbol}`, '_blank');
    
    // Option B: We’ll connect this to Python bot + your API token next
}

connect();
setInterval(() => {
    document.getElementById('update-time').textContent = new Date().toLocaleTimeString();
}, 1000);
</script>
