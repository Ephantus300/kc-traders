<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KC Traders Pro - Live Signals</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: linear-gradient(135deg, #0a0a0a 0%, #1a0a00 100%);
    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    padding: 20px;
}
.header {
    text-align: center;
    padding: 30px 0;
    border-bottom: 2px solid #ff6b00;
    margin-bottom: 40px;
}
.header h1 {
    font-size: 3em;
    background: linear-gradient(90deg, #ff6b00, #ffaa00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(255, 107, 0, 0.5);
    animation: glow 2s ease-in-out infinite alternate;
}
@keyframes glow {
    from { filter: brightness(1); }
    to { filter: brightness(1.3); }
}
.ticker {
    background: #111;
    padding: 15px;
    border-top: 2px solid #ff6b00;
    border-bottom: 2px solid #ff6b00;
    overflow: hidden;
    white-space: nowrap;
    margin-bottom: 40px;
}
.ticker span {
    display: inline-block;
    padding-left: 100%;
    animation: scroll 20s linear infinite;
    color: #00ff88;
    font-weight: bold;
    font-size: 1.1em;
}
@keyframes scroll {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-100%, 0); }
}
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 30px;
    max-width: 1400px;
    margin: 0 auto;
}
.card {
    background: rgba(26, 26, 26, 0.8);
    border: 2px solid #ff6b00;
    border-radius: 20px;
    padding: 40px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 40px rgba(255, 107, 0, 0.4);
    transition: transform 0.3s;
}
.card:hover { transform: translateY(-10px); }
.card.v75 { border-color: #00ff88; box-shadow: 0 0 40px rgba(0, 255, 136, 0.4); }
.card h2 {
    font-size: 1.8em;
    margin-bottom: 10px;
    color: #ff6b00;
}
.card.v75 h2 { color: #00ff88; }
.strategy {
    color: #aaa;
    margin-bottom: 30px;
    font-size: 1.1em;
}
.digit-box {
    background: #000;
    border-radius: 15px;
    padding: 40px;
    text-align: center;
    margin: 30px 0;
    border: 3px solid #ff6b00;
}
.card.v75 .digit-box { border-color: #00ff88; }
.digit {
    font-size: 8em;
    font-weight: bold;
    color: #ff6b00;
    text-shadow: 0 0 50px currentColor;
    animation: pulse 1s infinite;
}
.card.v75 .digit { color: #00ff88; }
@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}
.status {
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    font-size: 1.3em;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 15px;
}
.wait { background: rgba(255, 170, 0, 0.2); color: #ffaa00; border: 2px solid #ffaa00; }
.trade { background: rgba(0, 255, 136, 0.2); color: #00ff88; border: 2px solid #00ff88; animation: blink 0.5s infinite; }
@keyframes blink {
    50% { opacity: 0.7; }
}
.buy-btn {
    display: none;
    width: 100%;
    padding: 18px;
    border: none;
    border-radius: 12px;
    color: #000;
    font-weight: bold;
    font-size: 1.3em;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
}
.buy-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px currentColor; }
#v100-btn { background: linear-gradient(90deg, #ff6b00, #ffaa00); }
#v75-btn { background: linear-gradient(90deg, #00ff88, #00cc66); }
.last-update {
    text-align: center;
    margin-top: 40px;
    color: #666;
    font-size: 0.9em;
}
</style>
</head>
<body>
<div class="header">
    <h1>KC TRADERS PRO</h1>
</div>

<div class="ticker">
    <span>🔥 LIVE SIGNALS ACTIVE | V100: DIGIT OVER 7 | V75: EVEN AFTER 4 ODD | Auto-Update Every Tick | Powered by Deriv WebSocket 🔥</span>
</div>

<div class="container">
    <!-- VOLATILITY 100 CARD -->
    <div class="card">
        <h2>Volatility 100 Index</h2>
        <p class="strategy">Strategy: DIGIT OVER 7</p>
        <div class="digit-box">
            <div class="digit" id="v100-digit">7</div>
        </div>
        <div class="status wait" id="v100-status">WAITING for digit > 7</div>
